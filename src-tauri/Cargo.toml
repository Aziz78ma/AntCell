[package]
name = "antcell-studio"
version = "0.1.0"
description = "Antcell premium desktop shell"
authors = ["OpenAI Codex"]
edition = "2021"

[lib]
name = "antcell_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

